name: Setup regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: >-
          python -m pip install
          -c https://raw.githubusercontent.com/home-assistant/core/2025.5.0/homeassistant/package_constraints.txt
          homeassistant==2025.5.0 LibJciHitachi==1.7.2 async-timeout==4.0.3
      - name: Test config-entry setup
        run: python -m unittest discover -s tests -v
